<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>淹れ記録</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="淹れ記録">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ECEFEA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1311">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  /* Layout: single column ledger of brews, bottom-sheet form, ratio shown as the signature figure */
  :root {
    --bg: #ECEFEA;
    --surface: #F8F9F6;
    --ink: #1B2320;
    --muted: #5E6B65;
    --line: #D3D9D2;
    --accent: #1F5F4A;
    --accent-ink: #F4F8F5;
    --star: #B7791F;
    --danger: #A33A2F;
    --scrim: rgba(20, 28, 24, 0.45);
    --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1311; --surface: #171D1A; --ink: #E6ECE7; --muted: #8F9C95; --line: #29322D;
      --accent: #6FC3A2; --accent-ink: #0C1511; --star: #E0B04F; --danger: #E27D70; --scrim: rgba(0, 0, 0, 0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1311; --surface: #171D1A; --ink: #E6ECE7; --muted: #8F9C95; --line: #29322D;
    --accent: #6FC3A2; --accent-ink: #0C1511; --star: #E0B04F; --danger: #E27D70; --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    padding-block: 20px 110px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  body.lock { overflow: hidden; }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
  .kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.2; margin: 0; text-wrap: balance; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-block: 1px solid var(--line); }
  .stat { padding: 10px 0; display: flex; flex-direction: column; gap: 2px; }
  .stat + .stat { padding-left: 14px; border-left: 1px solid var(--line); }
  .stat b { font-family: var(--font-mono); font-weight: 500; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }

  .search { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; font-size: 16px; }
  .search::placeholder { color: var(--muted); }

  .sample-note { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }
  .link-btn { background: none; border: none; padding: 4px 0; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; min-width: 0; }
  .card:active { background: var(--bg); }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .when { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ratio { font-family: var(--font-mono); font-weight: 500; font-size: 13px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 10px; font-variant-numeric: tabular-nums; }
  .bean { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.35; margin: 0; overflow-wrap: anywhere; }
  .sub { font-size: 13px; color: var(--muted); margin-top: -6px; overflow-wrap: anywhere; }
  .tag { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin-left: 6px; color: var(--muted); vertical-align: 1px; }
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .metric { display: flex; flex-direction: column; min-width: 0; }
  .metric small { font-size: 11px; color: var(--muted); }
  .metric b { font-family: var(--font-mono); font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; }
  .grind { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .notes { font-size: 14px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .stars { color: var(--star); letter-spacing: 0.1em; font-size: 15px; }
  .stars .off { color: var(--line); }
  .empty { text-align: center; color: var(--muted); padding: 28px 8px; border: 1px dashed var(--line); border-radius: 12px; }

  details.backup { border-top: 1px solid var(--line); padding-top: 12px; }
  details.backup summary { cursor: pointer; font-weight: 700; font-size: 14px; }
  .backup-body { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 500; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  textarea.paste { width: 100%; min-height: 84px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-family: var(--font-mono); font-size: 12px; }
  .status { font-size: 12px; color: var(--muted); }

  .fab-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: linear-gradient(to top, var(--bg) 62%, transparent);
    pointer-events: none;
  }
  .fab { pointer-events: auto; display: block; width: 100%; max-width: 560px; margin: 0 auto; border: none; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; padding: 15px; }

  .overlay { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 560px; max-height: 94dvh; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
  .sheet h2 { font-family: var(--font-display); font-size: 21px; margin: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label, .field .lab { font-size: 12px; color: var(--muted); font-weight: 500; }
  .field input, .field select, .field textarea { width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
  .field textarea { min-height: 84px; resize: vertical; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .ratio-live { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-block: 1px solid var(--line); padding: 8px 0; }
  .ratio-live span { font-size: 12px; color: var(--muted); }
  .ratio-live b { font-family: var(--font-mono); font-weight: 500; font-size: 26px; font-variant-numeric: tabular-nums; }
  .timer-row { display: flex; gap: 8px; }
  .timer-row input { flex: 1; }
  .rate { display: flex; gap: 4px; }
  .rate button { background: none; border: none; font-size: 30px; line-height: 1; padding: 2px 4px; color: var(--line); }
  .rate button.on { color: var(--star); }
  .sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .sheet-actions .primary { flex: 1; min-width: 120px; padding: 13px; }

  .toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 999px; padding: 8px 16px; font-size: 13px; max-width: calc(100% - 32px); }

  @media (max-width: 380px) { .metrics { grid-template-columns: repeat(2, 1fr); } }
  @media (prefers-reduced-motion: no-preference) { .card { transition: background 0.15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Brew Notebook</div>
    <h1>淹れ記録</h1>
  </header>

  <section class="stats" aria-label="集計">
    <div class="stat"><b id="st-count">0</b><span>記録</span></div>
    <div class="stat"><b id="st-avg">—</b><span>平均評価</span></div>
    <div class="stat"><b id="st-month">0</b><span>今月</span></div>
  </section>

  <input id="q" class="search" type="search" placeholder="豆・メモ・淹れ方で検索" autocomplete="off">

  <div id="sample-note" class="sample-note" hidden>
    <span>「サンプル」の付いた記録は例です。</span>
    <button id="clear-samples" class="link-btn" type="button">サンプルを消す</button>
  </div>

  <section id="list" class="list" aria-live="polite"></section>

  <details class="backup">
    <summary>バックアップと復元</summary>
    <div class="backup-body">
      <p id="backup-note" style="margin:0"></p>
      <div class="row">
        <button id="copy-json" class="btn" type="button">JSONをコピー</button>
        <button id="copy-csv" class="btn" type="button">CSVをコピー</button>
      </div>
      <label for="paste" class="lab">復元：コピーしたJSONを貼り付け</label>
      <textarea id="paste" class="paste" placeholder='[{"bean":"…"}]'></textarea>
      <div class="row"><button id="do-import" class="btn" type="button">読み込む（追加）</button></div>
      <div id="status" class="status"></div>
    </div>
  </details>
</div>

<div class="fab-bar"><button id="add" class="fab" type="button">＋ 今日の一杯を記録</button></div>

<div id="overlay" class="overlay" hidden>
  <form id="form" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" autocomplete="off">
    <h2 id="sheet-title">新しい記録</h2>

    <div class="field"><label for="f-ts">日時</label><input id="f-ts" type="datetime-local" required></div>
    <div class="field"><label for="f-bean">豆</label><input id="f-bean" type="text" list="bean-list" placeholder="例：エチオピア イルガチェフェ"><datalist id="bean-list"></datalist></div>
    <div class="grid2">
      <div class="field"><label for="f-roaster">焙煎所</label><input id="f-roaster" type="text"></div>
      <div class="field"><label for="f-roast">焙煎度</label><select id="f-roast"></select></div>
    </div>
    <div class="field"><label for="f-method">淹れ方</label><select id="f-method"></select></div>

    <div class="grid2">
      <div class="field"><label for="f-dose">粉（g）</label><input id="f-dose" class="num" type="number" inputmode="decimal" step="0.1" min="0"></div>
      <div class="field"><label for="f-water">湯（g）</label><input id="f-water" class="num" type="number" inputmode="decimal" step="1" min="0"></div>
    </div>
    <div class="ratio-live"><span>粉に対する湯の比率</span><b id="ratio-live">—</b></div>

    <div class="grid2">
      <div class="field"><label for="f-temp">湯温（℃）</label><input id="f-temp" class="num" type="number" inputmode="decimal" step="1" min="0" max="100"></div>
      <div class="field"><label for="f-grind">挽き目</label><input id="f-grind" type="text" placeholder="例：24クリック"></div>
    </div>

    <div class="field">
      <label for="f-time">抽出時間（分:秒）</label>
      <div class="timer-row">
        <input id="f-time" class="num" type="text" inputmode="numeric" placeholder="2:30">
        <button id="timer-btn" class="btn" type="button">計測開始</button>
      </div>
    </div>

    <div class="field"><span class="lab">評価</span><div id="rate" class="rate" role="group" aria-label="評価"></div></div>
    <div class="field"><label for="f-notes">メモ（味・次に変えること）</label><textarea id="f-notes"></textarea></div>

    <div class="sheet-actions">
      <button class="btn primary" type="submit">保存</button>
      <button id="cancel" class="btn" type="button">閉じる</button>
      <button id="delete" class="btn danger" type="button" hidden>削除</button>
    </div>
  </form>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  var KEY = 'brewlog.v1';
  var METHODS = ['ハンドドリップ（V60）', 'ハンドドリップ（その他）', 'ケメックス', 'エアロプレス', 'フレンチプレス', 'エスプレッソ', 'モカポット', '水出し', 'その他'];
  var ROASTS = ['浅煎り', '中浅煎り', '中煎り', '中深煎り', '深煎り'];
  var entries = [];
  var canStore = true;
  var editingId = null;
  var rating = 0;
  var timer = { start: 0, id: null };
  var delArmed = null;
  var toastTimer = null;
  var dbCol = null, dbMode = false, ready = false;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function nowLocal(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function num(v) { var n = parseFloat(v); return isFinite(n) ? n : null; }
  function ratioOf(e) { return e.dose > 0 && e.water > 0 ? e.water / e.dose : null; }
  function fmtRatio(r) { return r == null ? '—' : '1 : ' + r.toFixed(1); }
  function fmtTime(s) { if (s == null) return '—'; return Math.floor(s / 60) + ':' + pad(Math.round(s % 60)); }
  function parseTime(v) {
    v = String(v || '').trim().replace('：', ':');
    if (!v) return null;
    if (v.indexOf(':') >= 0) { var p = v.split(':'); var m = parseInt(p[0], 10), s = parseInt(p[1], 10); if (isNaN(m)) return null; return m * 60 + (isNaN(s) ? 0 : s); }
    var n = parseInt(v, 10); return isNaN(n) ? null : n;
  }
  function fmtDate(ts) {
    var d = new Date(ts); if (isNaN(d)) return ts || '';
    var wd = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
    return (d.getMonth() + 1) + '/' + d.getDate() + '（' + wd + '）' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw === null) return null;
      var v = JSON.parse(raw);
      return Array.isArray(v) ? v : [];
    } catch (e) { canStore = false; return null; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(entries)); canStore = true; } catch (e) { canStore = false; }
    updateStatus();
  }
  function updateStatus(msg) {
    $('status').textContent = msg || (dbMode ? '保存先：このページのクラウド保存（' + entries.length + '件）' : (canStore ? '保存先：この端末のブラウザ内（' + entries.length + '件）' : 'この環境では保存できません。閉じると記録が消えるので、バックアップをコピーしてください。'));
    $('backup-note').textContent = dbMode
      ? '記録はこのページに紐づくクラウドに保存され、あなたのアカウントでだけ読み書きできます。アプリを閉じても残ります。念のため、ときどきコピーして「メモ」などに貼っておくと安心です。'
      : '記録はこの端末のこのブラウザ内にだけ保存されます。サイトデータを消すと失われるので、ときどきコピーして「メモ」などに貼っておくと安心です。';
  }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
  }

  function seed() {
    var d1 = new Date(Date.now() - 86400000), d2 = new Date(Date.now() - 3 * 86400000);
    d1.setHours(7, 40, 0, 0); d2.setHours(8, 15, 0, 0);
    return [
      { id: uid(), sample: true, ts: nowLocal(d1), bean: 'エチオピア イルガチェフェ', roaster: 'サンプル焙煎所', roast: '浅煎り', method: METHODS[0], dose: 15, water: 240, temp: 92, grind: 'コマンダンテ 24クリック', time: 165, rating: 4, notes: '華やかな酸味。蒸らし30秒。湯温をあと1℃下げてみる。' },
      { id: uid(), sample: true, ts: nowLocal(d2), bean: 'コロンビア ウイラ', roaster: 'サンプル焙煎所', roast: '中深煎り', method: METHODS[3], dose: 16, water: 220, temp: 88, grind: '中細挽き', time: 130, rating: 3, notes: '苦味がやや強い。次は挽き目を粗くする。' }
    ];
  }

  function stars(n) {
    var s = '';
    for (var i = 1; i <= 5; i++) s += i <= n ? '★' : '<span class="off">★</span>';
    return s;
  }

  function render() {
    var q = $('q').value.trim().toLowerCase();
    var sorted = entries.slice().sort(function (a, b) { return a.ts < b.ts ? 1 : -1; });
    var shown = sorted.filter(function (e) {
      if (!q) return true;
      return [e.bean, e.roaster, e.roast, e.method, e.grind, e.notes].join(' ').toLowerCase().indexOf(q) >= 0;
    });

    var rated = entries.filter(function (e) { return e.rating > 0; });
    var avg = rated.length ? rated.reduce(function (a, e) { return a + e.rating; }, 0) / rated.length : null;
    var ym = nowLocal().slice(0, 7);
    $('st-count').textContent = entries.length;
    $('st-avg').textContent = avg == null ? '—' : avg.toFixed(1);
    $('st-month').textContent = entries.filter(function (e) { return (e.ts || '').slice(0, 7) === ym; }).length;
    $('sample-note').hidden = !entries.some(function (e) { return e.sample; });

    if (!shown.length) {
      $('list').innerHTML = '<div class="empty">' + (entries.length ? '一致する記録がありません。' : (ready ? 'まだ記録がありません。下のボタンから最初の一杯を残しましょう。' : '読み込み中…')) + '</div>';
    } else {
      $('list').innerHTML = shown.map(function (e) {
        var r = ratioOf(e);
        return '<article class="card" data-id="' + esc(e.id) + '" tabindex="0" role="button" aria-label="' + esc(e.bean || '名称なし') + 'を編集">' +
          '<div class="card-top"><span class="when">' + esc(fmtDate(e.ts)) + '</span>' + (r != null ? '<span class="ratio">' + esc(fmtRatio(r)) + '</span>' : '') + '</div>' +
          '<h3 class="bean">' + esc(e.bean || '名称なし') + (e.sample ? '<span class="tag">サンプル</span>' : '') + '</h3>' +
          '<div class="sub">' + esc([e.method, e.roast, e.roaster].filter(Boolean).join(' ・ ')) + '</div>' +
          '<div class="metrics">' +
            '<div class="metric"><small>粉</small><b>' + (e.dose != null ? esc(e.dose) + ' g' : '—') + '</b></div>' +
            '<div class="metric"><small>湯</small><b>' + (e.water != null ? esc(e.water) + ' g' : '—') + '</b></div>' +
            '<div class="metric"><small>湯温</small><b>' + (e.temp != null ? esc(e.temp) + ' ℃' : '—') + '</b></div>' +
            '<div class="metric"><small>時間</small><b>' + esc(fmtTime(e.time)) + '</b></div>' +
          '</div>' +
          (e.grind ? '<div class="grind">挽き目：' + esc(e.grind) + '</div>' : '') +
          (e.notes ? '<p class="notes">' + esc(e.notes) + '</p>' : '') +
          (e.rating ? '<div class="stars" aria-label="評価 ' + esc(e.rating) + '">' + stars(e.rating) + '</div>' : '') +
        '</article>';
      }).join('');
    }

    var beans = {};
    entries.forEach(function (e) { if (e.bean) beans[e.bean] = 1; });
    $('bean-list').innerHTML = Object.keys(beans).map(function (b) { return '<option value="' + esc(b) + '">'; }).join('');
    updateStatus();
  }

  function fillSelect(el, items) { el.innerHTML = items.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join(''); }

  function buildRate() {
    var html = '';
    for (var i = 1; i <= 5; i++) html += '<button type="button" data-v="' + i + '" aria-label="' + i + '">★</button>';
    $('rate').innerHTML = html;
  }
  function setRating(n) {
    rating = n;
    Array.prototype.forEach.call($('rate').children, function (b) { b.classList.toggle('on', parseInt(b.dataset.v, 10) <= n); });
  }
  function updateRatioLive() { $('ratio-live').textContent = fmtRatio(ratioOf({ dose: num($('f-dose').value), water: num($('f-water').value) })); }

  function stopTimer() {
    if (timer.id) { clearInterval(timer.id); timer.id = null; }
    $('timer-btn').textContent = '計測開始';
  }
  function toggleTimer() {
    if (timer.id) { stopTimer(); return; }
    timer.start = Date.now();
    $('timer-btn').textContent = '停止';
    $('f-time').value = '0:00';
    timer.id = setInterval(function () { $('f-time').value = fmtTime(Math.floor((Date.now() - timer.start) / 1000)); }, 250);
  }

  function resetDelete() { delArmed = null; $('delete').textContent = '削除'; }

  function openSheet(id) {
    editingId = id || null;
    resetDelete(); stopTimer();
    var e = id ? entries.filter(function (x) { return x.id === id; })[0] : null;
    var last = entries.slice().sort(function (a, b) { return a.ts < b.ts ? 1 : -1; })[0];
    $('sheet-title').textContent = e ? '記録を編集' : '新しい記録';
    $('f-ts').value = e ? e.ts : nowLocal();
    $('f-bean').value = e ? e.bean : '';
    $('f-roaster').value = e ? e.roaster : (last && !last.sample ? last.roaster : '');
    $('f-roast').value = e ? e.roast : (last ? last.roast : ROASTS[2]);
    $('f-method').value = e ? e.method : (last ? last.method : METHODS[0]);
    $('f-dose').value = e ? (e.dose == null ? '' : e.dose) : '';
    $('f-water').value = e ? (e.water == null ? '' : e.water) : '';
    $('f-temp').value = e ? (e.temp == null ? '' : e.temp) : '';
    $('f-grind').value = e ? e.grind : '';
    $('f-time').value = e && e.time != null ? fmtTime(e.time) : '';
    $('f-notes').value = e ? e.notes : '';
    setRating(e ? e.rating || 0 : 0);
    $('delete').hidden = !e;
    updateRatioLive();
    $('overlay').hidden = false;
    document.body.classList.add('lock');
    $('overlay').firstElementChild.scrollTop = 0;
  }
  function closeSheet() { stopTimer(); $('overlay').hidden = true; document.body.classList.remove('lock'); editingId = null; }

  function submit(ev) {
    ev.preventDefault();
    stopTimer();
    var data = {
      ts: $('f-ts').value || nowLocal(),
      bean: $('f-bean').value.trim(),
      roaster: $('f-roaster').value.trim(),
      roast: $('f-roast').value,
      method: $('f-method').value,
      dose: num($('f-dose').value),
      water: num($('f-water').value),
      temp: num($('f-temp').value),
      grind: $('f-grind').value.trim(),
      time: parseTime($('f-time').value),
      rating: rating,
      notes: $('f-notes').value.trim()
    };
    var saved;
    if (editingId) {
      entries = entries.map(function (x) { if (x.id !== editingId) return x; var o = {}; for (var k in x) o[k] = x[k]; for (var j in data) o[j] = data[j]; saved = o; return o; });
    } else {
      data.id = uid();
      saved = data;
      entries.push(data);
    }
    save(); render(); remotePut(saved); closeSheet(); toast('保存しました');
  }

  function doDelete() {
    if (delArmed !== editingId) {
      delArmed = editingId;
      $('delete').textContent = 'もう一度押して削除';
      setTimeout(function () { if (delArmed === editingId) resetDelete(); }, 3000);
      return;
    }
    var gone = editingId;
    entries = entries.filter(function (x) { return x.id !== gone; });
    save(); render(); remoteDelMany([gone]); closeSheet(); toast('削除しました');
  }

  function copyText(text, label) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) toast(label + 'をコピーしました');
      else { $('paste').value = text; $('paste').select(); toast('下の欄に表示しました。全選択してコピーしてください'); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(label + 'をコピーしました'); }, fallback);
    } else fallback();
  }

  function toCSV() {
    var head = ['日時', '豆', '焙煎所', '焙煎度', '淹れ方', '粉g', '湯g', '比率', '湯温', '挽き目', '時間', '評価', 'メモ'];
    function q(v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var rows = entries.slice().sort(function (a, b) { return a.ts < b.ts ? -1 : 1; }).map(function (e) {
      var r = ratioOf(e);
      return [e.ts, e.bean, e.roaster, e.roast, e.method, e.dose, e.water, r == null ? '' : r.toFixed(1), e.temp, e.grind, e.time == null ? '' : fmtTime(e.time), e.rating || '', e.notes].map(q).join(',');
    });
    return [head.map(q).join(',')].concat(rows).join('\n');
  }

  function doImport() {
    var raw = $('paste').value.trim();
    if (!raw) { toast('JSONを貼り付けてください'); return; }
    var arr;
    try { arr = JSON.parse(raw); } catch (e) { toast('JSONとして読み込めませんでした'); return; }
    if (!Array.isArray(arr)) { toast('配列形式のJSONが必要です'); return; }
    var have = {}; entries.forEach(function (e) { have[e.id] = 1; });
    var added = 0, fresh = [];
    arr.forEach(function (o) {
      if (!o || typeof o !== 'object') return;
      var id = o.id && !have[o.id] ? String(o.id) : (o.id ? null : uid());
      if (!id) return;
      have[id] = 1;
      var item = {
        id: id, sample: !!o.sample, ts: String(o.ts || nowLocal()), bean: String(o.bean || ''), roaster: String(o.roaster || ''),
        roast: String(o.roast || ROASTS[2]), method: String(o.method || METHODS[0]),
        dose: num(o.dose), water: num(o.water), temp: num(o.temp), grind: String(o.grind || ''),
        time: o.time == null ? null : num(o.time), rating: Math.max(0, Math.min(5, parseInt(o.rating, 10) || 0)), notes: String(o.notes || '')
      };
      entries.push(item); fresh.push(item);
      added++;
    });
    save(); render(); remotePutMany(fresh); $('paste').value = '';
    toast(added + '件を追加しました');
  }

  fillSelect($('f-roast'), ROASTS);
  fillSelect($('f-method'), METHODS);
  buildRate();

  function clean(e) { return JSON.parse(JSON.stringify(e)); }
  function dbFail(err) { toast(err && err.code === 'quota_exceeded' ? 'クラウドの保存上限に達しました' : 'クラウドへの保存に失敗しました。端末内には保存済みです'); }
  async function remotePut(e) { if (!dbCol) return; try { await dbCol.doc(e.id).set(clean(e)); } catch (err) { dbFail(err); } }
  async function remotePutMany(list) { for (var i = 0; i < list.length; i++) await remotePut(list[i]); }
  async function remoteDelMany(ids) {
    if (!dbCol) return;
    for (var i = 0; i < ids.length; i++) { try { await dbCol.doc(ids[i]).delete(); } catch (err) { dbFail(err); break; } }
  }

  var loaded = load();
  if (loaded !== null) { entries = loaded; ready = true; }
  render();

  // Cloud storage: one private document per brew under this viewer's own subtree.
  // Falls back to this browser's localStorage when the database is unavailable.
  async function initDb() {
    var db = null, viewerId = null;
    try {
      if (window.claude && window.claude.use) {
        db = await window.claude.use('db');
        var user = await window.claude.use('user');
        viewerId = user ? await user.id() : null;
      }
    } catch (e) { db = null; }
    if (!db || !viewerId) {
      if (loaded === null) { entries = seed(); save(); }
      ready = true; render(); return;
    }
    dbCol = db.collection('data/users/' + viewerId);
    var initDone = false;
    dbCol.onSnapshot(function (snap) {
      if (snap.metadata.fromCache && snap.empty) return;
      var hasMeta = false, real = [];
      snap.docs.forEach(function (d) {
        if (d.id === '_meta') { hasMeta = true; return; }
        var v = d.data();
        if (v && typeof v === 'object') { var o = {}; for (var k in v) o[k] = v[k]; o.id = d.id; real.push(o); }
      });
      dbMode = true; ready = true;
      if (!hasMeta && !initDone && !snap.metadata.fromCache) {
        initDone = true;
        if (!real.length) {
          var mine = entries.filter(function (e) { return !e.sample; });
          entries = mine;
          (async function () {
            await remotePutMany(mine);
            try { await dbCol.doc('_meta').set({ init: true, at: Date.now() }); } catch (err) { dbFail(err); }
          })();
          save(); render(); return;
        }
        dbCol.doc('_meta').set({ init: true, at: Date.now() }).catch(function () {});
      }
      entries = real; save(); render();
    }, function () {
      dbMode = false; dbCol = null; ready = true; render();
    });
  }
  initDb();

  $('add').addEventListener('click', function () { openSheet(null); });
  $('cancel').addEventListener('click', closeSheet);
  $('form').addEventListener('submit', submit);
  $('delete').addEventListener('click', doDelete);
  $('timer-btn').addEventListener('click', toggleTimer);
  $('f-time').addEventListener('input', function () { if (timer.id) stopTimer(); });
  $('f-dose').addEventListener('input', updateRatioLive);
  $('f-water').addEventListener('input', updateRatioLive);
  $('rate').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    var v = parseInt(b.dataset.v, 10); setRating(v === rating ? 0 : v);
  });
  $('overlay').addEventListener('click', function (ev) { if (ev.target === $('overlay')) closeSheet(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !$('overlay').hidden) closeSheet(); });
  $('q').addEventListener('input', render);
  $('list').addEventListener('click', function (ev) { var c = ev.target.closest('.card'); if (c) openSheet(c.dataset.id); });
  $('list').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { var c = ev.target.closest('.card'); if (c) openSheet(c.dataset.id); } });
  $('clear-samples').addEventListener('click', function () {
    var ids = entries.filter(function (e) { return e.sample; }).map(function (e) { return e.id; });
    entries = entries.filter(function (e) { return !e.sample; });
    save(); render(); remoteDelMany(ids); toast('サンプルを消しました');
  });
  $('copy-json').addEventListener('click', function () { copyText(JSON.stringify(entries.filter(function (e) { return !e.sample; }), null, 2), 'JSON'); });
  $('copy-csv').addEventListener('click', function () { copyText(toCSV(), 'CSV'); });
  $('do-import').addEventListener('click', doImport);
})();
</script>
</body>
</html>
